{%  extends 'base.html' %}

{% block content %}
    <div style="text-align: center; max-width: 760px; margin: 8rem auto;">
        <div style="margin-bottom: 4rem">
            <h2 style="margin-bottom: 4rem">[공휴일 안내 수정]</h2>
        </div>
        <div>
            <form action="{% url 'articleapp:holiday_update' holiday_message.id %}" method="post">
                {% csrf_token %}
                <div>
                    <label for="holiday_message" style="margin: 2rem">공휴일 안내:</label>
                    <textarea name="holiday_message" id="holiday_message" class="form-control" style="margin-bottom: 2rem">{{ holiday_message.holiday_message }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary rounded-pill col-3 mt-4">저장</button>
            </form>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js"></script>
<script>
    tinymce.init({
        selector: '#holiday_message',
        menubar: false,
        branding: false,
        plugins: 'lists',
        toolbar: 'undo redo | fontsize | bold italic underline | forecolor backcolor | bullist | removeformat',
        height: 280,
        fontsize_formats: '12px 14px 16px 18px 24px 32px',
        content_style: 'body { font-family: "Noto Sans KR", sans-serif; font-size: 16px; }'
    });
</script>
{% endblock %}
