<script>
    (function() {
        var statusUrl = "{% url 'superapp:kiosk_status' %}";
        function pollScreen() {
            fetch(statusUrl, {credentials: 'same-origin', cache: 'no-store'})
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.url && location.pathname !== data.url) {
                        location.href = data.url;
                        return;
                    }
                    setTimeout(pollScreen, 3000);
                })
                .catch(function() { setTimeout(pollScreen, 5000); });
        }
        pollScreen();
    })();
</script>
