<script>
    (function() {
        var statusUrl = "{% url 'superapp:kiosk_status' %}";
        var closedDay = false;
        var generation = 0;
        var screenWasOn = true;
        var screenOff = false;
        var wakeAt = 0;
        var wakeGraceUntil = 0;
        var GRACE_MS = 20000;

        function localScreenOff(now) {
            var minutes = now.getHours() * 60 + now.getMinutes();
            if (now.getDay() === 3) {
                return minutes < 10 * 60 || minutes >= 20 * 60 + 30;
            }
            return minutes < 5 * 60 || minutes >= 18 * 60;
        }

        function beginWake() {
            generation += 1;
            closedDay = false;
            screenOff = false;
            screenWasOn = true;
            wakeAt = Date.now();
            wakeGraceUntil = wakeAt + GRACE_MS;
        }

        function screenIsOn() {
            try {
                if (window.fully && typeof fully.getScreenOn === 'function') return fully.getScreenOn() === true;
            } catch (e) {}
            return !screenOff;
        }

        function noteWake() {
            var on = screenIsOn();
            if (on && !screenWasOn) beginWake();
            screenWasOn = on;
        }

        function shouldTurnScreenOff(now) {
            if (Date.now() < wakeGraceUntil) return false;
            if (localScreenOff(now)) return true;
            return closedDay === true;
        }

        function turnScreenOffNow() {
            generation += 1;
            closedDay = false;
            screenWasOn = false;
            screenOff = true;
            try {
                if (window.fully && typeof fully.turnScreenOff === 'function') fully.turnScreenOff();
            } catch (e) {}
        }

        function turnScreenOffAtNight() {
            noteWake();
            if (screenOff) return;
            try {
                if (!shouldTurnScreenOff(new Date())) return;
                turnScreenOffNow();
            } catch (e) {}
        }

        window.kioskOnScreenOn = function() {
            beginWake();
            pollScreen();
        };

        function pollScreen() {
            if (screenOff) return;
            var myGeneration = generation;
            var startedAt = Date.now();
            turnScreenOffAtNight();
            if (screenOff) return;
            fetch(statusUrl, {credentials: 'same-origin', cache: 'no-store'})
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    noteWake();
                    if (screenOff || myGeneration !== generation || startedAt < wakeAt) {
                        if (!screenOff) setTimeout(pollScreen, 3000);
                        return;
                    }
                    if (typeof data.closed_day === 'boolean') closedDay = data.closed_day;
                    turnScreenOffAtNight();
                    var nextPath = data.url ? data.url.split('?')[0].replace(/\/+$/, '') : '';
                    var herePath = location.pathname.replace(/\/+$/, '');
                    if (nextPath && herePath !== nextPath) {
                        location.replace(data.url);
                        return;
                    }
                    if (!screenOff) setTimeout(pollScreen, 3000);
                })
                .catch(function() { if (!screenOff) setTimeout(pollScreen, 5000); });
        }

        if (window.fully && typeof fully.bind === 'function') {
            fully.bind('screenOn', 'if (window.kioskOnScreenOn) window.kioskOnScreenOn();');
        }
        turnScreenOffAtNight();
        setInterval(turnScreenOffAtNight, 3000);
        pollScreen();
    })();
</script>
