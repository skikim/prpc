<style>
    .weekly-third-warning {
        display: none;
        margin: 14px auto 16px;
        max-width: 280px;
        padding: 12px 14px;
        background: #FEF3F2;
        border: 2px solid #C2410C;
        border-radius: 8px;
        color: #9A3412;
        font-weight: 700;
        font-size: 0.95rem;
        line-height: 1.4;
    }
    .weekly-third-warning b {
        color: #C2410C;
        font-size: 0.95rem;
    }
    .weekly-third-warning.weekly-second-warning {
        background: #EEF3F9;
        border-color: #1d4e89;
        color: #1e3a5f;
    }
    .weekly-third-warning.weekly-second-warning b {
        color: #1d4e89;
    }
</style>
<script>
    (function() {
        var noticeUrl = "{% url 'superapp:weekly_third_notice' %}";
        function hideWarning() {
            var warn = document.getElementById('weekly-third-warning');
            if (!warn) return;
            warn.style.display = 'none';
            warn.classList.remove('weekly-second-warning');
        }
        function refreshWeeklyThird() {
            var warn = document.getElementById('weekly-third-warning');
            var status = document.getElementById('status_sel');
            var userId = document.getElementById('booking_user_id');
            var bookingRn = document.getElementById('booking_rn');
            var date = document.getElementById('date');
            var time = document.getElementById('time');
            var hasUser = userId && userId.value;
            var hasChart = bookingRn && /\d+\s*$/.test(bookingRn.value) && bookingRn.value.trim() !== '*';
            if (!warn || !date || !date.value || !status || (status.value !== '예약요청' && status.value !== '예약승인') || (!hasUser && !hasChart)) {
                hideWarning();
                return;
            }
            var url = noticeUrl + '?date=' + encodeURIComponent(date.value) + '&time=' + encodeURIComponent(time ? time.value : '');
            if (hasUser) url += '&user_id=' + encodeURIComponent(userId.value);
            else url += '&booking_rn=' + encodeURIComponent(bookingRn.value);
            fetch(url, {credentials: 'same-origin', cache: 'no-store'})
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (!data.warn) {
                        hideWarning();
                        return;
                    }
                    warn.classList.toggle('weekly-second-warning', Number(data.nth) === 2);
                    warn.innerHTML = '이 환자는 이번 주 <b>' + Number(data.nth) + '번째 예약</b>입니다.';
                    warn.style.display = 'block';
                })
                .catch(hideWarning);
        }
        $(document).on('input change', '#booking_user_id, #booking_rn', refreshWeeklyThird);
        $(document).on('change', '#status_sel', refreshWeeklyThird);
        $(document).on('click', '#result_table tr', function() { setTimeout(refreshWeeklyThird, 0); });
        $('#modal_post').on('show.bs.modal', hideWarning);
        $('#modal_post').on('shown.bs.modal', refreshWeeklyThird);
    })();
</script>
